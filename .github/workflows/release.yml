# Push a tag like v1.0.0 and the .deb is attached to a GitHub release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build-deb.sh
      # a second copy under a name that never changes, so the "latest" download link is stable
      - run: cp dist/timetracker_*_all.deb dist/timetracker.deb
      - run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
