<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f77fa8"/>
      <stop offset="1" stop-color="#d63a73"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f0"/>
    </linearGradient>
  </defs>
  <!-- squircle base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)"/>
  <!-- stopwatch crown and side button -->
  <rect x="57" y="23" width="14" height="12" rx="3" fill="#ffffff"/>
  <rect x="50" y="19" width="28" height="8" rx="4" fill="#ffffff"/>
  <rect x="88.500" y="33" width="9" height="13" rx="3" transform="rotate(45 93 39.500)" fill="#ffffff"/>
  <!-- soft shadow, then the face -->
  <circle cx="64" cy="71" r="35" fill="#8f1d47" opacity="0.25"/>
  <circle cx="64" cy="69" r="35" fill="url(#face)"/>
  <!-- the stretch of time already tracked -->
  <path d="M64 69 L64 43 A26 26 0 0 1 86.517 82 Z" fill="#f77fa8" opacity="0.55"/>
  <!-- hand -->
  <path d="M64 69 L86.517 82" stroke="#b02a5b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="69" r="5.500" fill="#b02a5b"/>
</svg>
